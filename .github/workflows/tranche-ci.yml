name: Tranche CI — Basic Validation

on:
  push:
    branches:
      - 'feature/phase4-tranche-*'
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate-structure:
    name: Validate Repository Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Unreal Frontend Files
        run: |
          if [ -d "native-frontends/unreal-frontend" ]; then
            echo "✅ Unreal frontend directory found"
            find native-frontends/unreal-frontend -name "*.h" -o -name "*.cpp" | head -20
          else
            echo "❌ Unreal frontend directory not found"
            exit 1
          fi

      - name: Verify Unity Frontend Files
        run: |
          if [ -d "native-frontends/unity-frontend" ]; then
            echo "✅ Unity frontend directory found"
            find native-frontends/unity-frontend -name "*.cs" -o -name "*.uxml" | head -20
          else
            echo "❌ Unity frontend directory not found"
            exit 1
          fi

      - name: Verify Governance Artifacts
        run: |
          if [ -f "SourceOfTruth/TODO_LEDGER.md" ]; then
            echo "✅ TODO_LEDGER.md present"
          else
            echo "❌ TODO_LEDGER.md missing"
            exit 1
          fi
          
          if [ -f "SourceOfTruth/CHANGELOG.md" ]; then
            echo "✅ CHANGELOG.md present"
          else
            echo "❌ CHANGELOG.md missing"
            exit 1
          fi
          
          if [ -f "SourceOfTruth/QUESTIONS.md" ]; then
            echo "✅ QUESTIONS.md present"
          else
            echo "❌ QUESTIONS.md missing"
            exit 1
          fi

      - name: Check Git Status
        run: |
          echo "Repository structure validated successfully"
          git status
          
      - name: Upload Validation Report
        uses: actions/upload-artifact@v4
        with:
          name: validation-report-${{ github.run_id }}
          path: |
            SourceOfTruth/
            native-frontends/
