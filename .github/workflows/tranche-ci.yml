name: Tranche CI — Unity (Headless) + Unreal Automation

on:
  push:
    branches:
      - 'feature/phase4-tranche-*'
  pull_request:
    branches:
      - main
      - develop

env:
  UNITY_PROJECT_PATH: native-frontends/unity-frontend
  UNITY_TEST_RESULTS: ${{ github.workspace }}/unity-test-results.xml
  UNITY_LOG: ${{ github.workspace }}/unity-tests.log
  UNITY_VERSION: "2021.3.45f2"
  UNREAL_PROJECT_PATH: native-frontends/unreal-frontend
  UNREAL_TEST_RESULTS_DIR: ${{ github.workspace }}/unreal-automation-results

jobs:
  unity-headless:
    name: Unity PlayMode Tests (headless)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Library and Packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.UNITY_PROJECT_PATH }}/Library
            ${{ env.UNITY_PROJECT_PATH }}/Packages
          key: unity-cache-${{ runner.os }}-${{ hashFiles('native-frontends/unity-frontend/Packages/manifest.json') }}
          restore-keys: |
            unity-cache-${{ runner.os }}-

      - name: Setup Unity
        uses: game-ci/unity-actions/setup@v2
        with:
          version: ${{ env.UNITY_VERSION }}
          # license: ${{ secrets.UNITY_LICENSE }}   # optional: set if using an activated license

      - name: Run Unity PlayMode tests headless
        shell: cmd
        run: |
          cd "%GITHUB_WORKSPACE%\${{ env.UNITY_PROJECT_PATH }}"
          "%UNITY_EDITOR%" -projectPath "." -batchmode -runTests -testPlatform PlayMode -testResults "${{ env.UNITY_TEST_RESULTS }}" -logFile "${{ env.UNITY_LOG }}" -quit

      - name: Upload Unity logs and results
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-results-${{ github.run_id }}
          path: |
            ${{ env.UNITY_TEST_RESULTS }}
            ${{ env.UNITY_LOG }}

  unreal-automation:
    name: Unreal Automation (RunUAT)
    runs-on: ubuntu-latest
    needs: unity-headless
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup prerequisites (mono, dotnet, java)
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-complete openjdk-11-jre-headless

      - name: Find Unreal project and RunUAT
        id: run_automation
        run: |
          set -e
          UNREAL_DIR="${GITHUB_WORKSPACE}/${{ env.UNREAL_PROJECT_PATH }}"
          echo "Unreal project path: $UNREAL_DIR"
          mkdir -p "${{ env.UNREAL_TEST_RESULTS_DIR }}"
          if [ -f "$UNREAL_DIR/Build/BatchFiles/RunUAT.sh" ]; then
            bash "$UNREAL_DIR/Build/BatchFiles/RunUAT.sh" BuildCookRun -project="$UNREAL_DIR/$(basename $UNREAL_DIR).uproject" -unattended -test -reportoutput="$UNREAL_DIR/Automation/Logs" || true
          else
            echo "No RunUAT.sh found in project. Searching for Automation logs."
          fi
          find "$UNREAL_DIR" -type f -name "*.log" -path "*/Automation/*" -maxdepth 6 -print | xargs -I{} cp {} "${{ env.UNREAL_TEST_RESULTS_DIR }}/" || true

      - name: Upload Unreal automation logs
        uses: actions/upload-artifact@v4
        with:
          name: unreal-automation-results-${{ github.run_id }}
          path: ${{ env.UNREAL_TEST_RESULTS_DIR }}

  collect-and-verify:
    name: Collect results and set status
    runs-on: ubuntu-latest
    needs: [unity-headless, unreal-automation]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Unity artifacts
        uses: actions/download-artifact@v4
        with:
          name: unity-test-results-${{ github.run_id }}
          path: ./artifacts/unity

      - name: Download Unreal artifacts
        uses: actions/download-artifact@v4
        with:
          name: unreal-automation-results-${{ github.run_id }}
          path: ./artifacts/unreal

      - name: Show Unity test results summary
        run: |
          if [ -f "./artifacts/unity/unity-test-results.xml" ]; then
            echo "Unity test results:"
            xmllint --format ./artifacts/unity/unity-test-results.xml | sed -n '1,200p' || cat ./artifacts/unity/unity-test-results.xml
          else
            echo "Unity results not found"
            ls -al ./artifacts/unity || true
            exit 1
          fi

      - name: Show Unreal logs
        run: |
          echo "Unreal logs (top 200 lines per file):"
          for f in ./artifacts/unreal/*; do
            echo "--- $f ---"
            head -n 200 "$f" || true
          done

      - name: Upload consolidated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tranche-ci-artifacts-${{ github.run_id }}
          path: |
            ./artifacts/unity
            ./artifacts/unreal
            ${{ env.UNITY_TEST_RESULTS }}
            ${{ env.UNITY_LOG }}
